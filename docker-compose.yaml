services:
  perplexica:
    image: itzcrazykns1337/perplexica:latest
    build:
      context: .
    ports:
      - '3020:3000'
    environment:
      - LM_STUDIO_BASE_URL=http://10.10.0.137:1234
    dns:
      - 10.10.0.1
    volumes:
      - ./.next:/home/perplexica/.next:ro
      - data:/home/perplexica/data
    entrypoint: ["/bin/sh", "-c", "/usr/local/searxng/searx-pyenv/bin/pip install yt-dlp --quiet && exec /home/perplexica/entrypoint.sh"]
    restart: unless-stopped

volumes:
  data:
    name: 'perplexica-data'
